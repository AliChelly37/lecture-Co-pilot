[project]
name = "lecture-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Chelly", email = "achelly7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "dateparser>=1.4.3",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "numpy>=2.4.6",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pynput>=1.8.2",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
lecture-copilot = "lecture_copilot:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
